<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 14; ry: 14; }
      .hot { fill: #fde7d8; stroke: #c65d1a; stroke-width: 3; }
      .good { fill: #dff3e4; stroke: #2e7d32; stroke-width: 3; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 12; ry: 12; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
  </defs>

  <rect x="20" y="20" width="1360" height="880" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="24" ry="24" />

  <text x="700" y="65" text-anchor="middle" class="title">Quest Streaming Architecture Comparison</text>
  <text x="700" y="95" text-anchor="middle" class="body">Why direct Quest streaming is slower, and why Windows + Air Link is the better architecture</text>

  <rect x="50" y="130" width="620" height="710" class="panel" />
  <text x="360" y="170" text-anchor="middle" class="subtitle">Current Flow: Quest Does Everything</text>

  <rect x="110" y="210" width="180" height="70" class="box" />
  <text x="200" y="248" text-anchor="middle" class="body">Quest Sensors</text>
  <text x="200" y="267" text-anchor="middle" class="small">Camera / Head / Hands</text>

  <rect x="110" y="330" width="180" height="70" class="box" />
  <text x="200" y="368" text-anchor="middle" class="body">Quest App</text>
  <text x="200" y="387" text-anchor="middle" class="small">Unity Runtime</text>

  <rect x="110" y="450" width="220" height="85" class="hot" />
  <text x="220" y="488" text-anchor="middle" class="body">Quest Rendering</text>
  <text x="220" y="507" text-anchor="middle" class="small">Hologram Composition</text>
  <text x="220" y="526" text-anchor="middle" class="small">GPU/CPU Heavy</text>

  <rect x="390" y="450" width="220" height="85" class="hot" />
  <text x="500" y="488" text-anchor="middle" class="body">Quest Encode + WebRTC</text>
  <text x="500" y="507" text-anchor="middle" class="small">Video Compression</text>
  <text x="500" y="526" text-anchor="middle" class="small">Additional Latency</text>

  <rect x="390" y="590" width="180" height="70" class="box" />
  <text x="480" y="628" text-anchor="middle" class="body">Network</text>
  <text x="480" y="647" text-anchor="middle" class="small">Wi-Fi Transport</text>

  <rect x="390" y="710" width="180" height="70" class="box" />
  <text x="480" y="748" text-anchor="middle" class="body">Receiver Device</text>
  <text x="480" y="767" text-anchor="middle" class="small">Display Output</text>

  <line x1="200" y1="280" x2="200" y2="330" class="arrow" />
  <line x1="200" y1="400" x2="200" y2="450" class="arrow" />
  <line x1="330" y1="492" x2="390" y2="492" class="arrow" />
  <line x1="500" y1="535" x2="500" y2="590" class="arrow" />
  <line x1="480" y1="660" x2="480" y2="710" class="arrow" />

  <line x1="290" y1="245" x2="540" y2="245" class="dash" />
  <line x1="540" y1="245" x2="540" y2="450" class="dash" />
  <text x="410" y="235" text-anchor="middle" class="small">Interaction also handled on Quest</text>

  <rect x="95" y="600" width="230" height="150" class="note" />
  <text x="210" y="630" text-anchor="middle" class="subtitle" style="font-size:16px;">Problem</text>
  <text x="115" y="660" class="body">- Quest handles rendering,</text>
  <text x="115" y="682" class="body">  composition, encoding,</text>
  <text x="115" y="704" class="body">  streaming, and XR runtime</text>
  <text x="115" y="726" class="body">- Limited mobile hardware</text>

  <rect x="730" y="130" width="620" height="710" class="panel" />
  <text x="1040" y="170" text-anchor="middle" class="subtitle">Recommended Flow: Windows Does the Heavy Work</text>

  <rect x="790" y="210" width="190" height="80" class="box" />
  <text x="885" y="248" text-anchor="middle" class="body">Meta Quest</text>
  <text x="885" y="267" text-anchor="middle" class="small">Display + Head/Hand Input</text>

  <rect x="1080" y="210" width="190" height="80" class="box" />
  <text x="1175" y="248" text-anchor="middle" class="body">Air Link</text>
  <text x="1175" y="267" text-anchor="middle" class="small">Low-Latency PC Link</text>

  <rect x="935" y="360" width="220" height="85" class="good" />
  <text x="1045" y="398" text-anchor="middle" class="body">Windows PC Rendering</text>
  <text x="1045" y="417" text-anchor="middle" class="small">Hologram Composition</text>
  <text x="1045" y="436" text-anchor="middle" class="small">Heavy Compute Here</text>

  <rect x="935" y="500" width="220" height="85" class="good" />
  <text x="1045" y="538" text-anchor="middle" class="body">Windows Encode / Stream</text>
  <text x="1045" y="557" text-anchor="middle" class="small">More Processing Headroom</text>
  <text x="1045" y="576" text-anchor="middle" class="small">Better Throughput</text>

  <rect x="935" y="640" width="220" height="70" class="box" />
  <text x="1045" y="678" text-anchor="middle" class="body">Receiver Device</text>
  <text x="1045" y="697" text-anchor="middle" class="small">Display Output</text>

  <line x1="980" y1="250" x2="1080" y2="250" class="arrow" />
  <line x1="1175" y1="290" x2="1175" y2="330" class="arrow" />
  <line x1="1175" y1="330" x2="1100" y2="330" class="arrow" />
  <line x1="1100" y1="330" x2="1100" y2="360" class="arrow" />
  <line x1="1045" y1="445" x2="1045" y2="500" class="arrow" />
  <line x1="1045" y1="585" x2="1045" y2="640" class="arrow" />

  <line x1="885" y1="290" x2="885" y2="330" class="dash" />
  <line x1="885" y1="330" x2="990" y2="330" class="dash" />
  <text x="865" y="320" text-anchor="end" class="small">Head/hand input</text>

  <rect x="785" y="725" width="510" height="100" class="note" />
  <text x="1040" y="755" text-anchor="middle" class="subtitle" style="font-size:16px;">Benefit</text>
  <text x="1040" y="783" text-anchor="middle" class="body">Windows handles rendering and streaming workload;</text>
  <text x="1040" y="805" text-anchor="middle" class="body">Quest mainly handles display and interaction</text>
  <text x="1040" y="827" text-anchor="middle" class="body">via Air Link.</text>

  <rect x="520" y="855" width="360" height="28" fill="#fde7d8" stroke="#c65d1a" stroke-width="1.5" rx="8" ry="8" />
  <text x="700" y="874" text-anchor="middle" class="small">Orange = heavy workload on limited Quest hardware</text>

  <rect x="900" y="855" width="340" height="28" fill="#dff3e4" stroke="#2e7d32" stroke-width="1.5" rx="8" ry="8" />
  <text x="1070" y="874" text-anchor="middle" class="small">Green = heavy workload moved to Windows PC</text>
</svg>
